<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso administrador</title>
<link rel="icon" href="/img/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,75..125,400..900;1,75..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-page">
  <main class="login">
    <img class="login__logo" src="/img/logo.jpg" alt="Nuto Automotores" width="120" height="120">
    <h1>Acceso administrador</h1>
    <form id="form" novalidate>
      <label>Email
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="error" role="alert"></p>
      <button class="btn" type="submit" id="submit">Ingresar</button>
    </form>
    <a class="back" id="forgotLink" href="/admin/login" hidden>¿Olvidó su contraseña?</a>
    <form id="recoveryForm" novalidate hidden>
      <p>Ingrese el email asociado a su cuenta. Si existe, recibirá un enlace para restablecer su contraseña.</p>
      <label>Email
        <input type="email" name="email" autocomplete="username" maxlength="254" required>
      </label>
      <p class="error" id="recoveryError" role="alert"></p>
      <button class="btn" type="submit" id="recoverySubmit">Enviar enlace</button>
      <button class="btn btn--ghost" type="button" id="recoveryCancel">Volver al login</button>
    </form>
    <a class="back" href="/">← Volver a Nuto Automotores</a>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
