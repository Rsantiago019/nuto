<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Restablecer contraseña</title>
<link rel="icon" href="/img/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,75..125,400..900;1,75..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-page">
  <main class="login">
    <img class="login__logo" src="/img/logo.jpg" alt="Nuto Automotores" width="120" height="120">
    <h1>Restablecer contraseña</h1>
    <form id="resetForm" novalidate>
      <label>Nueva contraseña
        <input type="password" name="password" autocomplete="new-password" minlength="10" required autofocus>
      </label>
      <label>Repetir contraseña
        <input type="password" name="confirmation" autocomplete="new-password" minlength="10" required>
      </label>
      <p class="hint">Mínimo 10 caracteres, con letras y números.</p>
      <p class="error" id="resetError" role="alert"></p>
      <button class="btn" type="submit" id="resetSubmit">Guardar contraseña</button>
    </form>
    <a class="back" href="/">← Volver a Nuto Automotores</a>
  </main>
  <script src="/js/reset-password.js"></script>
</body>
</html>
